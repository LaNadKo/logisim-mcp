name: Portable validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Download pinned runtimes and verify hashes
        run: python scripts/fetch_dependencies.py --platform ${{ matrix.platform }}
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libxrender1 libxtst6 libxi6 libfreetype6 fontconfig libasound2t64 libgtk-3-0
      - name: Relocate and test with bundled runtimes on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/ci_check.py
      - name: Relocate and test with bundled runtimes on Windows or macOS
        if: runner.os != 'Linux'
        run: python scripts/ci_check.py
